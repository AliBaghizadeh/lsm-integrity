[project]
name = "lsm-integrity"
version = "0.1.0"
description = "LSM pipeline-integrity ML lifecycle demonstrator"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.1",
    "pandas",
    "pyarrow",
    "pandera",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "scikit-learn==1.9.0",
    "lightgbm==4.6.0",
    "mlflow",
    "dagster",
    "streamlit",
    "matplotlib",
    "pydeck",
    "duckdb",
    "psutil",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pip-audit"]

[project.scripts]
lsm = "lsm.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]

[tool.mypy]
# None of numpy/pandas/pyarrow/sklearn/lightgbm/joblib/yaml/scipy ship inline
# types or stubs this project installs -- ignore_missing_imports here, once,
# so `mypy src/lsm` behaves identically locally and in CI rather than relying
# on everyone remembering a command-line flag.
ignore_missing_imports = true
