[project]
name = "lsm-integrity"
version = "0.1.0"
description = "LSM pipeline-integrity ML lifecycle demonstrator"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pandera",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "scikit-learn",
    "lightgbm",
    "mlflow",
    "dagster",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[project.scripts]
lsm = "lsm.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
