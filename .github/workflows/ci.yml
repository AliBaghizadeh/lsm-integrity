name: CI

# Code-quality gate, on every push/PR: ruff + mypy + pip-audit + the full test
# suite + a lightweight CLI smoke run. Deliberately does NOT include model
# training (see train.yml) -- that has its own, statistical gate (Stage 3/4
# recall/coverage thresholds) which can legitimately fail without any code
# being wrong. Entangling the two would make this badge red for reasons
# unrelated to code correctness, which defeats the point of a CI badge.
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src/lsm

      - name: pip-audit
        # `python -m pip_audit`, not the bare `pip-audit` console script --
        # more portable across environments where entry-point scripts land
        # somewhere not on PATH. Informational, not blocking: a new CVE in an
        # unrelated transitive dependency shouldn't turn this badge red for a
        # PR that touched nothing security-relevant. Findings are still
        # visible in the log.
        run: python -m pip_audit || true

      - name: "pytest (unit, leakage, determinism, bundle round-trip, golden regression)"
        run: pytest -q

      - name: CLI smoke run (generate -> ingest -> features, real base.yaml)
        # Proves the actual `lsm` entry point works end to end, not just the
        # Python API pytest exercises. Stops at `features`, deliberately --
        # `lsm train` evaluates the Stage 3/4 promotion gates and belongs to
        # train.yml, not this fast, code-correctness-only workflow.
        run: |
          python -m lsm generate
          python -m lsm ingest
          python -m lsm features
